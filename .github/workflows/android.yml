name: Android CI

# Branch workflow: runs on claude/** and planning/** pushes and on pull requests. It never publishes a release
# and never touches signing material (release is built unsigned unless the owner adds repository secrets).
on:
  push:
    branches: ['claude/**', 'planning/**', 'ccr-**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the real-page benchmark corpus (recipe-scrapers test data, MIT, pinned commit; not stored in this repository)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/recipe-scrapers" && cd "$RUNNER_TEMP/recipe-scrapers"
          git remote add origin https://github.com/hhursev/recipe-scrapers.git
          git fetch -q --depth 1 origin 00b529730a619da361facc7d0b94f0dd26bd517f
          git checkout -q FETCH_HEAD && git log -1 --format='corpus commit %H %ci'
          echo "TR_CORPUS_DIR=$RUNNER_TEMP/recipe-scrapers/tests/test_data" >> "$GITHUB_ENV"
        continue-on-error: true
      - name: Unit + Robolectric UI tests (includes the real-page importer benchmark when the corpus was fetched)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Show the importer benchmark line
        if: always()
        run: |
          line=$(grep -rhao "REAL-PAGE BENCHMARK[^]]*" app/build/test-results/testDebugUnitTest | head -1 || true)
          if [ -n "$line" ]; then echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "::warning::The real-page importer benchmark did not run (corpus not fetched)."; fi
      - name: Upload test reports and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/screens
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true
      - name: Assemble debug and release (R8) APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          TR_VERSION_CODE: ${{ github.run_number }}
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: touch-recipe-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Summarize failed tests (kept last so it is the end of the log)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, html
          total = failed = 0
          for p in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              x = open(p, encoding='utf8', errors='replace').read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', x)
              if m: total += int(m.group(1)); failed += int(m.group(3)) + int(m.group(4))
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<(?:failure|error) message="([^"]*)"', x):
                  print('FAILED-TEST', c.group(2).split('.')[-1] + '.' + c.group(1), '::', html.unescape(c.group(3)).replace('\n', ' | ')[:700])
          print('TEST-TOTALS tests=%d failed=%d' % (total, failed))
          PY

  instrumented:
    # Runs the on-device smoke tests on an emulator (these are NOT run in the local sandbox).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: instrumentation-reports, path: app/build/reports/androidTests }
