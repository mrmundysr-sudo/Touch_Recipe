name: Android CI

# Branch workflow: runs on claude/** and planning/** pushes and on pull requests. It never publishes a release
# and never touches signing material (release is built unsigned unless the owner adds repository secrets).
on:
  push:
    branches: ['claude/**', 'planning/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + Robolectric UI tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload test reports and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/screens
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true
      - name: Assemble debug and release (R8) APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          TR_VERSION_CODE: ${{ github.run_number }}
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: touch-recipe-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  instrumented:
    # Runs the on-device smoke tests on an emulator (these are NOT run in the local sandbox).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: instrumentation-reports, path: app/build/reports/androidTests }
